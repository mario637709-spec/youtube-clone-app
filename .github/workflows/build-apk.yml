name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build YouTube Clone APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Next.js Static Web Bundle
        working-directory: frontend
        run: CAPACITOR_BUILD=true NEXT_PUBLIC_IS_CAPACITOR=true NEXT_PUBLIC_API_URL=https://kiro-youtube-app-backend.onrender.com/api npx next build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android || true

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x frontend/android/gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeClone-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create Release with APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: YouTube Clone Android App v1.0.${{ github.run_number }}
          body: |
            ## 📱 YouTube Clone Android App
            Automated build from GitHub Actions.
            - Direct Google Video streaming without CORS restrictions.
            - Mobile IP binding for direct CDN streaming.
          files: frontend/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-emulator:
    name: Run Android Emulator & Capture Live Screenshots
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM Virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: YouTubeClone-Debug-APK
          path: apk_folder

      - name: Run Android Emulator and Test APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect
          script: |
            echo "Waiting for Android device to boot..."
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb shell input keyevent 82 || true
            
            echo "Installing APK..."
            adb install apk_folder/*.apk
            adb logcat -c || true
            
            echo "Launching App com.kiro.youtube..."
            adb shell monkey -p com.kiro.youtube -c android.intent.category.LAUNCHER 1
            
            echo "Waiting 22 seconds for live feed from Firebase RTDB to render..."
            sleep 22
            
            echo "1. Capturing Live Home Feed Screenshot..."
            adb exec-out screencap -p > emulator_home_screenshot.png
            
            echo "2. Simulating user scroll to test video feed lazy-load..."
            adb shell input swipe 500 1600 500 400 400
            sleep 6
            adb exec-out screencap -p > emulator_scrolled_screenshot.png

            echo "3. Tapping first visible video card to navigate to Watch Page..."
            adb shell input tap 540 850
            sleep 15
            adb exec-out screencap -p > emulator_watch_opened.png

            echo "Checking app is still in the foreground..."
            if adb shell dumpsys window | grep -q 'mCurrentFocus=.*com.kiro.youtube'; then echo "App is foreground"; else echo "APP CRASHED OR LEFT FOREGROUND"; adb logcat -d -t 500; adb logcat -d > emulator_full_logcat.txt; exit 1; fi

            echo "4. Tapping video player center to trigger/unpause playback..."
            adb shell input tap 540 450
            echo "Waiting 6 seconds while video streams from Google CDN..."
            sleep 6
            adb exec-out screencap -p > emulator_video_playing_1.png

            echo "5. Waiting 7 seconds for playback time progression..."
            sleep 7
            adb exec-out screencap -p > emulator_video_playing_2.png

            echo "6. Tapping player to show progress scrubber timeline and playback controls..."
            adb shell input tap 540 450
            sleep 1
            adb exec-out screencap -p > emulator_video_controls.png

            echo "7. Capturing logcat media stream logs..."
            adb logcat -d | grep -E "chromium|MediaPlayer|NuPlayer|MediaCodec|stream|Capacitor|VideoPlayer|clientStream|youtubeDirect" | tail -n 200 > emulator_playback_logs.txt || true
            adb logcat -d > emulator_full_logcat.txt || true

            echo "8. Navigating back and tapping Shorts..."
            adb shell input keyevent 4 || true
            sleep 3
            adb shell input tap 360 2150 || true
            sleep 6
            adb exec-out screencap -p > emulator_shorts_screenshot.png

            ls -lh emulator_*.png

      - name: Upload Screenshots as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-emulator-screenshots
          path: |
            emulator_*.png
            emulator_playback_logs.txt
            emulator_full_logcat.txt

      - name: Commit Screenshots to Repository for Live Preview
        run: |
          mkdir -p docs/screenshots
          cp emulator_*.png docs/screenshots/
          cp emulator_playback_logs.txt docs/screenshots/ || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          git commit -m "docs: update live Android emulator video playback screenshots [skip ci]" || true
          git push origin main || true
